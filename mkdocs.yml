site_name: Done in 60 seconds
site_description: Solving common Power BI challenges in less than 60 seconds. Deterministic, token free and model-independent.
site_author: Eivind Haugen
site_url: https://eivind4.github.io/DoneIn60seconds/
repo_url: https://github.com/Eivind4/DoneIn60seconds
repo_name: Eivind4/DoneIn60seconds
edit_uri: edit/main/docs/

hooks:
  - hooks/publishing.py

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo/logo-b-axis.svg
  favicon: assets/logo/logo-c-icon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

extra:
  tagline: Solving common Power BI challenges in less than 60 seconds

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight: { anchor_linenums: true, line_spans: __span }
  - pymdownx.inlinehilite
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.snippets: { base_path: ["."], check_paths: true }
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# One line per page. Draft / future-dated pages are removed automatically at build time.
nav:
  - Home: index.md
  - General:
    - general/index.md
    - About: general/about.md
    - Tabular Editor: general/tabular-editor.md
    - PBIR files: general/pbir-files.md
    - Theme file: general/theme-file.md
    - Semantic Link Labs: general/semantic-link-labs.md
  - Semantic model:
    - semantic-model/index.md
    - Create a calendar: semantic-model/create-calendar.md
    - Create time intelligence: semantic-model/create-time-intelligence.md
    - Measures with time intelligence: semantic-model/measures-with-time-intelligence.md
    - Dynamic axis: semantic-model/dynamic-axis.md
    - Comparison: semantic-model/comparison.md
    - Ranking: semantic-model/ranking.md
    - Error bars: semantic-model/error-bars.md
    - Conditional formatting: semantic-model/conditional-formatting.md
  - PBIR:
    - pbir/index.md
    - Update column or measure name: pbir/update-column-measure-name.md
    - Batch rename measures: pbir/batch-rename-measures.md
    - Fix broken measures: pbir/fix-broken-measures.md
    - Set display name: pbir/set-display-name.md
    - Update display name: pbir/update-display-name.md
    - Detect unused objects: pbir/detect-unused-objects.md
  - Best Practice Rules:
    - best-practice-rules/index.md
    - Automate fixes with fix scripts: best-practice-rules/automate-fixes.md
  - Master model:
    - master-model/index.md
    - Create model from perspective: master-model/create-model-from-perspective.md
